        content: |
            I’m a system engineer and scientist working at the intersection of advanced optical imaging, perception systems, and physical AI. Currently at [Applied Materials](https://www.appliedmaterials.com/us/en.html), I'm working on advanced imaging technology development for the semiconductor industry, with a focus on metrology solutions for the next generation of AI hardware. I used to build the camera perception system and advanced driver assistance system for the first personal robocar across autonomy levels L0-L4 at [Tensor Auto](https://tensor.auto).

            I received my Ph.D. in Biomedical Engineering from the University of Michigan in 2025, where I developed a multimodal in vivo imaging system integrating photoacoustic microscopy, optical coherence tomography, and fluorescence microscopy. The platform enabled high-resolution structural, functional, and molecular imaging for applications including early cancer detection, drug-delivery monitoring, and ophthalmic disease studies.
            

            Previously, I earned the M.S. in Optical Engineering from Zhejiang University in 2021, where I built a high-precision 3D metrology system based on light-sheet microscopy for quality inspection of industrial samples, and a hyperspectral imager for environmental and remote sensing. I also earned dual B.S. degrees in Optoelectronic Science and Engineering and Financial Engineering from Sichuan University in 2018.

            My long-term passion lies in developing intelligent imaging and perception systems that empower physical AI, from advanced vision solution to artificial gneral intelligence (AGI) product operating in physical world. I welcome meaningful discussion and potential collaboration, feel free to contact me via [zhanpeng@umich.edu](mailto:zhanpeng@umich.edu), or DM me on [LinkedIn](https://www.linkedin.com/in/zhanpeng-xu-816a36278/).
